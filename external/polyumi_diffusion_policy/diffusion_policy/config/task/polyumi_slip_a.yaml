# Slip-control BASELINE -- audio only, no tactile, no scene camera.
#
# One arm of the {t, a, ta, v, vt, va, vta} ablation lattice around polyumi_gripper_only_delta
# (the tactile+audio "ta" member): this drops the finger camera to isolate what the contact mic
# alone is worth. Gripper-only and RELATIVE like every sibling here -- see
# polyumi_gripper_only_delta.yaml for why the pose half of the action was dropped project-wide,
# not just for this variant.
#
# Two consequences follow from having no `*_eef_pos` key in shape_meta, and the fork handles both:
#   - SequenceSampler builds the action from gripper_width alone rather than [pos, rot, gripper].
#   - UmiDataset's num_robot is 0, so its pose-relative machinery and per-robot action split are
#     skipped; the action passes through as the single width column.
name: polyumi_slip_a

camera_obs_latency: 0.125
gripper_obs_latency: 0.02
dataset_frequeny: 0 #29.97
obs_down_sample_steps: 3 # 29.97/3 ~= 10 Hz, matching the ROS control loop

low_dim_obs_horizon: 2
img_obs_horizon: 2
# One mic_0 row is 536 samples at 16 kHz = 33.5 ms, so 10 rows spans ~335 ms of contact history.
# Matches n_audio_rows in the ROS client's inference.yaml; the two must move together.
audio_obs_horizon: 10

shape_meta: &shape_meta
  obs:
    mic_0:
      # Raw 16 kHz contact-mic waveform, one row per exported step, exactly as
      # ingest/polyumi_ingest/export/dp/audio.py writes it. The encoder concatenates the rows
      # before its STFT, so this shape is per-row and the window length is the horizon above.
      shape: [536]
      horizon: ${task.audio_obs_horizon}
      latency_steps: 0
      down_sample_steps: 1 # rows are already on the step grid
      type: audio
      n_mels: 64
      out_dim: 128
      sample_rate: 16000
      # No f_min override: the model sees the raw contact-mic signal. A 300 Hz floor measured much
      # better (see MelAudioEncoder) -- add `f_min: 300.0` here once the raw baseline is understood.
    robot0_gripper_width:
      # Both an input and the thing predicted. Over a 1.6 s chunk this is a weak predictor of
      # itself -- copy-last-value scores R^2 = 0.075 on the slip corpus -- so there is no trivial
      # identity shortcut for the model to fall into, but score any result against that baseline
      # rather than against the loss alone.
      shape: [1]
      horizon: ${task.low_dim_obs_horizon}
      latency_steps: 0
      down_sample_steps: ${task.obs_down_sample_steps}
      type: low_dim
      ignore_by_policy: False
  action:
    # One number: the gripper width. No rotation_rep -- there is no rotation to represent, and the
    # dataset's rotation transformer never runs because num_robot is 0.
    shape: [1]
    horizon: 16
    latency_steps: 0
    down_sample_steps: ${task.obs_down_sample_steps}

task_name: &task_name polyumi_slip_a
# Bind-mounted into the container by the run wrapper; override with task.dataset_path=... .
dataset_path: /data/dataset.zarr.zip

env_runner:
  _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: diffusion_policy.dataset.umi_dataset.UmiDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  cache_dir: null
  pose_repr:
    obs_pose_repr: relative
    action_pose_repr: relative
    # Predict the CHANGE in gripper width from the width observed at t_obs, not the width itself.
    # UmiDataset subtracts that base in __getitem__, so the action normalizer is fitted on deltas;
    # serve_policy reads this same key out of the checkpoint and adds the base back, keeping the
    # wire contract absolute. Score any result against "predict zero", not against the loss --
    # most steps barely move, so a delta model's MSE is small for trivial reasons.
    action_gripper_repr: relative
  action_padding: False
  temporally_independent_normalization: False
  repeat_frame_prob: 0.0
  max_duration: null
  seed: 42
  val_ratio: 0.05
