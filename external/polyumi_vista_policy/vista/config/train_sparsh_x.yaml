defaults:
  - _self_
  - task: vista_multimodal

name: train_sparsh_x
_target_: vista.workspace.train_vista_workspace.TrainVistaWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: default

n_action_steps: 8

policy:
  _target_: vista.models.sparsh_x.SparshXPolicy
  shape_meta: ${shape_meta}
  n_obs_steps: ${task.n_obs_history}
  # ~155M total; perception/head ≈ 1.01 (matched to diffusion_unet scale)
  d_embed: 512
  depth: 6
  fusion_layer: 3
  num_heads: 8
  num_bottlenecks: 4
  dit_layers: 18
  adaln_zero: true
  n_inference_steps: 10
  encoder_ckpt: null
  patch_size: 16

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 8
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 8
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  encoder_lr: 3.0e-5
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: cuda:0
  seed: 42
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 200
  num_epochs: 120
  gradient_accumulate_every: 1
  use_ema: true
  checkpoint_every: 10
  val_every: 1

logging:
  project: ${oc.env:WANDB_PROJECT,vista}
  entity: ${oc.env:WANDB_ENTITY,null}
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt'
  save_last_ckpt: true

hydra:
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
