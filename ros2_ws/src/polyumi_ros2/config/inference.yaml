# policy_client_node inference config: control cadence + per-component system latencies.
# Loaded by inference_demo.launch.xml via `<param from="...">`. This is the single place to
# tune how the on-arm inference loop runs; the node's own declared defaults mirror these.

/**:
  ros__parameters:
    # Receding-horizon stride: run inference once per this many control ticks, NOT every tick.
    # The obs window still updates every tick (stays dt-spaced); a new action chunk is only
    # requested/published every steps_per_inference ticks, while the arm executes the previous
    # one. This is UMI's scheme (re-infer every ~steps_per_inference*dt) and it stops the
    # per-tick POST/publish storm. 1 = infer every tick. Should be <= n_action_steps.
    steps_per_inference: 1

    # How many action steps to request per inference. The chunk must span the whole
    # observation->motion budget for a device, or every action in it is already in the past by the
    # time that device can act, _n_stale_actions drops all of them, and nothing is published:
    # If this is more than the amount of steps the model is trained to generate, the extra steps
    # are ignored.
    n_action_steps: 16

    # Temporal ensembling: recency decay constant, in seconds, for blending each new action chunk
    # with the recent chunks that overlap it (polyumi_ros2/temporal_ensemble.py). 0 disables it.
    #
    # The policy re-predicts its whole horizon every steps_per_inference ticks and the successive
    # predictions do not agree, so executing each new chunk at face value steps the commanded
    # target by however much the model changed its mind. Blending trades reactivity for smoothness:
    # larger values average in staler predictions, so the arm is slower to respond to genuinely new
    # information — which for contact-critical work is the wrong thing to be slow at. Hence a value
    # on the order of ONE stride (steps_per_inference * 1/control_hz = 0.3s here), which smooths the
    # handoff between consecutive chunks without averaging over a meaningfully stale window.
    #
    # Starting point, not a measured value: tune it against measured jerk with the A/B procedure in
    # ingest/integration/plot_measured_motion.py, the same way the interpolant was.
    temporal_ensemble_tau_s: 0.3

    # --- Per-component latencies, in seconds. ---
    # Measured with `ros2 run polyumi_ros2 latency_probe`, one mode per value. Procedures and what
    # each number does and does not cover: docs/calibration-instructions.md, "Latencies".
    #
    # Only ONE of these needs a rig. The budget is
    #
    #   photon --(gopro)--> header.stamp --(measured live)--> response --(arm_exec)--> motion
    #
    # and the middle span — YUYV convert, tick phasing, POST, network, the server's own inference
    # time — is measured empirically every tick by _n_stale_actions (`now() - t_obs`, evaluated
    # AFTER the response lands). That is why there is deliberately no round-trip constant here: a
    # config value would be strictly worse than the live measurement. UMI reaches the same place
    # from the other side, printing inference time and never subtracting it.
    latency:
      # Delay from a photon hitting the GoPro sensor to the frame's ROS header stamp:
      # GoPro encode + HDMI out + capture card + USB + v4l2 dequeue. Sets both the TF lookup
      # instant and t_obs for chunk truncation, so it is the most load-bearing value here.
      #
      # NOT the ~200 ms YUYV->RGB convert: v4l2_camera stamps at dequeue and converts afterwards,
      # so that cost lands after the stamp. It is what max_image_age_s has to tolerate, not this.
      #
      # calibrated 2026-08-11 on our lab's fr3 arm setup.
      gopro: 0.1087

      # Finger camera latency: the span from photon to the frame's ROS header stamp.
      #
      # 0.0 is a MEASURED value, not an unset one. The Pi stamps at capture in hardware, so the
      # stamp already is the capture instant and there is no pre-stamp delay to correct. This is
      # the opposite situation to gopro above, where v4l2_camera stamps at dequeue and the whole
      # chain sits ahead of the stamp.
      #
      # It does NOT mean the finger camera is as timely as the wrist camera. Its transport runs
      # after the stamp -- JPEG encode, the ZMQ hop, the link, the receive loop -- measured at
      # 161 ms median over the USB gadget link on 2026-09-08. That delay is why policy_client_node
      # anchors on the OLDEST capture instant across streams (_observation_instant) rather than the
      # wrist camera's; it cannot be expressed as a constant here, because it shifts which sample
      # is available rather than when that sample was taken.
      finger_cam: 0.0
      # Piezo mic latency. 0.0 for the same reason as finger_cam: polyumi_pi/clock.py removes the
      # capture buffer's occupancy from the stamp, so the stamp is the true capture instant of the
      # first sample in the block. Its post-stamp transport is handled by _observation_instant, as
      # the finger camera's is.
      piezo_mic: 0.0
      # Delay from the arm's true EE pose to its measurement appearing on TF.
      #
      # ADOPTED, not measured, and deliberately so: isolating it needs external ground truth of
      # the true pose. libfranka stamps at read, so it is ~1 ms. UMI hit the identical wall and
      # hardcodes robot_obs_latency: 0.0001. The arm_exec measurement below returns
      # (arm_exec + proprio), which at this magnitude is well inside its own noise floor.
      proprio: 0.001

      # How far the arm lags the impedance controller's equilibrium point. Not a transport delay:
      # policy_client_node anchors each chunk at t_obs - arm_exec so the equilibrium reaches pose k
      # that far early and the arm, trailing it, arrives on time.
      # This is a bit of a handwave-y placeholder architecturally; this quantity is really 
      # a combination of the frequency response of the controller and the actual hardware latency.
      # Might revisit a better way to handle this (without making the controller super stiff) later on.
      #
      # Used twice — by _n_stale_actions and by the chunk anchor — and the two cancel in timing but
      # not in phase. The first published waypoint lands at ~now whatever this value is, but WHICH
      # waypoint that is shifts by arm_exec/action_dt steps, so overstating it skips ahead in the
      # policy's trajectory rather than commanding early.
      #
      # Tuned on hardware, not measured: 0.04 is what the gear and pick-and-place runs
      # succeeded at. The servo-mode calibration measured 0.0910 (2026-08-19), and UMI
      # hardcodes robot_action_latency: 0.1 — both are the reference points this was tuned
      # down from, so re-derive from 0.0910 if the controller stiffness changes.
      arm_exec: 0.04

      # The gripper's counterpart to arm_exec: how far ahead of intent to command the hand.
      # franka_hand_node already plans each Move to ARRIVE at its waypoint's stated instant
      # (now + cmd_delay - t_obs_delay), so a lead here would command the fingers early on top of
      # that -- this is 0.0, under test, for exactly that reason. Revert to 0.380 if the hand runs
      # late in service.
      #
      # If you re-measure: mode:=gripper_chirp reports 370-450 ms, but most of that is the 363 ms
      # the hand stands still BETWEEN moves, not a feed-forward term. Don't paste it in blind.
      gripper_exec: 0.0

      # Delay from the hand's true aperture to it appearing on /fr3_gripper/joint_states. Kept
      # separate from proprio because the gripper is a different device on its own link and its
      # own (slower, jitterier) topic.
      #
      # 0.0: unmeasurable without a camera on the fingers, same as franka_hand_node's
      # t_obs_delay_s, which already guesses at it for the action side. Left at 0 rather than
      # duplicating that guess here, but kept as a real field for the gripper this hand is being
      # replaced by, where it may be measurable properly.
      gripper: 0.0

    # --- Gripper width conversion. CALIBRATED 2026-08-09. ---
    # The DP exporter subtracts the closed width, so the policy speaks metres of opening from
    # fully closed (UMI's convention). The robot speaks jaw aperture. Three measured quantities:
    #
    #   closed width     0.04456 m   ArUco finger-tag separation with the fingers touching.
    #                                This is gripper_calib.yaml's closed_mm, on the handheld rig.
    #                                (pingest calibrate-gripper, scene d044: 16320 detections, 980
    #                                within 1 mm of the value against 358 expected by chance)
    #   closed aperture  0.0     m   FR3 jaw aperture with the fingers touching -> min_width below
    #   open aperture    0.0812  m   FR3 jaw aperture at full open              -> max_width below
    #                                (calipers, 2026-08-29)
    #
    # gripper_min_width_m doubles as the policy->robot offset: policy width 0 means fully closed,
    # and fully closed on the arm is the closed aperture. There is no separate gripper_offset_m —
    # it was always exactly -gripper_min_width_m, so two knobs held one measurement and could be
    # set inconsistently. Since the closed aperture is 0.0 here the conversion is the IDENTITY plus
    # clamping, which is not a placeholder: these fingers meet at the mechanism's true zero, so
    # "opening from closed" and "jaw aperture" are the same quantity. UMI's WSG is in the same
    # position, which is why their inference path converts nothing either. Re-derive with the two
    # commands above after any change to the fingers or tags.
    #
    # The PolyUMI fingers set both ends, so this is the same 0-0.0812 m whichever driver is running.
    # The widely-quoted 0.105 m is the stock metal finger attachments, which also cannot close past
    # 0.023 m; these fingers meet at the mechanism's true zero instead.
    #
    # Cross-check, independent of the encoder: closed width + open aperture = 125.8 mm of tag
    # separation at full open, against the 132.3 mm the handheld reaches. The handheld opens 6.5 mm wider,
    # so the top ~7% of the policy's commanded range saturates here. That shows up as intent
    # clipping, not an error, and is inherent to the two mechanisms having different strokes.
    gripper_max_width_m: 0.0812
    gripper_min_width_m: 0.0

    # --- Tactile channels: the finger camera and the contact mic. ---
    # OFF by default, so a visuomotor policy (POLICY=dp) is served exactly as it was before these
    # existed — it requires neither channel and sending them would only cost bandwidth. Turn on
    # for the Vista family (vista, sparsh_x, polytouch, see_hear_feel), every member of which
    # indexes obs['finger_rgb'] and obs['mic_0'] unconditionally.
    #
    # Both channels are all-or-nothing per request: if either is missing or stale the tick is
    # skipped rather than a partial frame sent, because the wire format refuses per-channel
    # omission server-side (see polyumi_inference.types.Observation.require).
    send_tactile: false
    # The /pi prefix is the launch file's namespace for pi_receiver_node, which publishes
    # these under relative names. Without it these resolve to topics nothing publishes and
    # every tick is skipped for "tactile channels incomplete" -- valid-looking and silent.
    finger_image_topic: /pi/camera/image/compressed
    audio_topic: /pi/audio/raw

    # Rows of mic_0 per request — the policy's `audio_obs_horizon`.
    #
    # THIS MUST MATCH THE CHECKPOINT and nothing downstream can catch it being wrong: a window of
    # the wrong length is a perfectly valid frame that the policy was simply never trained on. 10
    # is the Vista fork's current shared contract (10 x 536 samples = ~0.33 s; see its
    # docs/SENSOR_PROCESSING.md). A checkpoint trained before that alignment wants 17. The node
    # logs the resolved value at startup for exactly this reason.
    n_audio_rows: 10

    # The finger_rgb crop. THIS IS THE CONTRACT: a policy trained on one crop cannot be served
    # frames from another. These mirror ingest/config/finger_camera.yaml, where the provenance of
    # x_min=170 is written down — it is the first column of the 1152x648 view that is entirely
    # image rather than the gripper mount or the lens blur across its edge, measured over 9
    # episodes in 3 scenes. -1 means "the frame's own edge", standing in for that file's `null`,
    # so the geometry survives a change of camera resolution.
    #
    # The node crops and does NOT resize, matching what the exporter STORES; the square-crop and
    # resize to the encoder's input size is the policy dataset's job at load time.
    # Resize applied after finger_crop, mirroring the exporter's output_size in
    # ingest/config/finger_camera.yaml. -1 means no resize (the native crop, ~648x982).
    # Set BOTH to whatever `pingest export --finger-output-size` used for the checkpoint's
    # dataset -- a policy whose encoder shares one image_shape across its rgb keys needs
    # finger_rgb at camera0_rgb's 224x224, and a mismatch is a silently wrong input shape.
    finger_output_size:
      width: 224
      height: 224
    finger_crop:
      x_min: 170
      x_max: -1
      y_min: 0
      y_max: -1

    # Largest age of the finger frame chosen for a step, in seconds. 0.3 is three periods of the
    # 10 fps camera. The delivered finger-frame rate on this rig sits below nominal, and a bound
    # tight enough to match the export skips most ticks outright ("tactile channels incomplete"),
    # which costs an eval far more than the extra staleness does. The export's own bound is 0.15,
    # so a frame admitted here can be older than any the training data contained — the price of
    # running at all, and worth stating when a rollout is judged.
    #
    # One asymmetry no bound can remove: the export picks the NEAREST frame, which may sit up to
    # half a period in the FUTURE of the step. Inference can only look backwards, so the same
    # bound admits a slightly older frame here than it did there. Unfixable — that future does not
    # exist at inference — and recorded so a rollout's staleness is judged against the right
    # baseline.
    max_finger_age_s: 0.3

    buffers:
      # How far back (seconds) the EE-pose TF buffer retains history, so a past pose can
      # still be looked up/interpolated to align with a delayed observation (e.g. the gopro
      # frame). Must be >= the largest latency above that gets compensated for.
      ee_pose_s: 1.0

      # Seconds of piezo audio retained. Must exceed n_audio_rows * 33.5 ms plus the largest
      # latency compensated for, or the mic_0 window runs off the start of the ring and is
      # silently zero-padded. 2.0 is ~6x the 10-row window.
      piezo_s: 2.0
